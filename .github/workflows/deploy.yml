name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Workload Identity Federation rather than a long-lived service account key.
# No JSON credential is ever stored in this repository.
permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: nxdomain-sentinel

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Fetch model artifact
        run: |
          mkdir -p artifacts
          gcloud storage cp "${{ secrets.MODEL_URI }}" artifacts/serving_model.pt

      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${SERVICE}/${SERVICE}:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" \
            --cpu 1 --memory 512Mi --concurrency 80 \
            --min-instances 0 --max-instances 4 \
            --cpu-throttling --allow-unauthenticated --quiet

      # A deploy that returns a URL but serves errors is not a successful deploy.
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "deployed to $URL"
          curl -fsS "$URL/healthz" > /dev/null
          curl -fsS "$URL/readyz"  > /dev/null
          curl -fsS -X POST "$URL/v1/score" \
            -H 'Content-Type: application/json' \
            -d '{"domain":"mortiscontrastatim.com"}' | tee /dev/stderr | grep -q '"verdict"'
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
