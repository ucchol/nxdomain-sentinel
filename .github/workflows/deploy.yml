name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: nxdomain-sentinel

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT: ${{ secrets.GCP_PROJECT }}
      MODEL_SHA256: ${{ vars.MODEL_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Fetch and verify model
        env:
          MODEL_URI: ${{ secrets.MODEL_URI }}
        run: |
          [[ "$MODEL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p artifacts
          gcloud storage cp "$MODEL_URI" artifacts/serving_model.pt
          printf '%s  %s\n' "$MODEL_SHA256" artifacts/serving_model.pt | sha256sum --check

      - name: Build and push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${SERVICE}/${SERVICE}:${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy private service
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" --project "$PROJECT" \
            --image "$IMAGE" --region "$REGION" \
            --cpu 1 --memory 512Mi --concurrency 4 \
            --min-instances 0 --max-instances 4 \
            --cpu-throttling --invoker-iam-check --no-allow-unauthenticated \
            --update-env-vars "NXS_MODEL_SHA256=$MODEL_SHA256" --quiet
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        id: invoke
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify private access and authenticated scoring
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          STATUS=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$URL/readyz")
          [[ "$STATUS" == 401 || "$STATUS" == 403 ]]
          curl -fsS --max-time 30 -H "Authorization: Bearer $TOKEN" "$URL/readyz" > /dev/null
          curl -fsS --max-time 30 -X POST "$URL/v1/score" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"domain":"mortiscontrastatim.com"}' | grep -q '"verdict"'
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
